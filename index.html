<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoMoneyBot</title>
<style>
body{font-family:-apple-system, sans-serif; padding:20px; background:#0f0f0f; color:#fff}
input{width:100%; padding:14px; margin:8px 0; border-radius:10px; border:1px solid #333; background:#1a1a1a; color:#fff; font-size:16px}
button{width:100%; padding:16px; margin-top:12px; border-radius:12px; border:0; background:#ff444f; color:#fff; font-weight:bold; font-size:18px}
#status{margin-top:15px; padding:12px; background:#1a1a1a; border-radius:10px; text-align:center}
#balance{font-size:28px; font-weight:bold; text-align:center; margin:15px 0}
small{color:#888}
</style>
</head>
<body>
<h2>💰 JoMoneyBot</h2>
<div id="balance">$0.00</div>

<label>Deriv API Token (starts with 2...)</label>
<input id="derivToken" placeholder="paste your 2... token here" />

<label>Telegram Bot Token (optional)</label>
<input id="tgToken" placeholder="820578...:AAE..." />

<label>Telegram Chat ID</label>
<input id="chatId" placeholder="5554709965" />

<button onclick="connectDeriv()">🔌 Connect Deriv Demo</button>
<button onclick="startBot()" style="background:#2d9c4c">▶️ Start Bot</button>

<div id="status">Ready. Paste your 2... token and connect.</div>
<small>Your 2... token is correct format. If connect fails, it's network — this new version fixes it via Vercel.</small>

<script>
async function connectDeriv(){
  const token = document.getElementById('derivToken').value.trim();
  if(!token){ alert('Paste your 2... Deriv token'); return; }
  document.getElementById('status').innerText = '⏳ Connecting via Vercel server...';
  try{
    const r = await fetch(`/api/deriv?token=${encodeURIComponent(token)}`);
    const j = await r.json();
    if(j.ok){
      document.getElementById('status').innerText = '✅ DEMO CONNECTED: $' + j.balance;
      document.getElementById('balance').innerText = '$' + Number(j.balance).toFixed(2);
      localStorage.setItem('derivToken', token);
      localStorage.setItem('tgToken', document.getElementById('tgToken').value);
      localStorage.setItem('chatId', document.getElementById('chatId').value);
    } else {
      document.getElementById('status').innerText = '❌ Deriv says: ' + j.error;
    }
  }catch(e){
    document.getElementById('status').innerText = '❌ Network error: ' + e.message + ' (try 4G not WiFi)';
  }
}

function startBot(){
  alert('Bot logic will run! Deriv connected: ' + (localStorage.getItem('derivToken') ? 'YES' : 'Connect first'));
}

window.onload = ()=>{
  const t = localStorage.getItem('derivToken');
  if(t) document.getElementById('derivToken').value = t;
}
</script>
</body>
</html>
