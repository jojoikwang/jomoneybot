<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JoMoneyBot Pro</title>
<style>body{margin:0;font-family:-apple-system,sans-serif;background:#fff5f6;padding:16px;color:#333;padding-bottom:120px}.header{font-size:26px;font-weight:800;color:#e57a9e}.card{background:white;border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 4px 20px rgba(229,122,158,.15)}input,select{width:100%;margin-top:8px;padding:14px;border-radius:12px;border:2px solid #ffd1dc;box-sizing:border-box;font-size:16px}select{font-weight:700;background:#fff0f3}.row{display:flex;gap:8px;margin-top:10px}.btn{flex:1;padding:12px;border-radius:30px;border:0;font-weight:700}.long{background:#f8bbd0}.short{background:#e9e0f0}.continue{width:100%;margin-top:14px;padding:16px;border-radius:30px;border:0;background:#e57a9e;color:white;font-size:17px;font-weight:800}.news{padding:12px;border-radius:12px;text-align:center;font-weight:700;margin-top:10px}.safe{background:#dcfce7;color:#166534}.danger{background:#fee2e2;color:#991b1b}</style></head>
<body>
<div class="header">🎀 JoMoneyBot <span style="font-size:11px;background:#e57a9e;color:white;padding:4px 8px;border-radius:20px">PRO DEMO FIX</span></div>
<div class="card" style="border:2px dashed #e57a9e">
<b>🔑 Connect Demo (iPhone Fix)</b>
<input id="derivToken" placeholder="pat_f593beadffa1f656fb8f9f1e54419d4b45ace5241104690c6655af8faad439f8">
<input id="tgToken" placeholder="8205789207:AAElKCnfzOTpUkgnduMPJx9KBvkD9JSgFKg">
<input id="tgChat" placeholder="5554709965">
<label style="font-size:13px;margin-top:10px;display:flex;gap:6px"><input type="checkbox" id="demoCheck" checked style="width:auto"> Use DEMO</label>
<button class="continue" onclick="connectDeriv()" style="background:#ff4d8d">Connect Deriv Demo → TAP HERE</button>
<div id="bal" style="margin-top:10px;font-weight:800;text-align:center;background:#fff0f3;padding:8px;border-radius:10px">Status: Ready</div>
</div>
<div id="newsBox" class="news safe">🟢 No high impact news — Safe to trade</div>
<div class="card"><div style="display:flex;justify-content:space-between"><b>XAU/USD</b><b id="price">2045.30</b></div>
<select id="pair"><option value="frxXAUUSD">XAU/USD - Gold 🔥</option><option value="frxEURUSD">EUR/USD</option><option value="R_75">V75</option></select>
<button class="continue" onclick="startBot()">🚀 Start News-Safe Bot</button>
</div>
<script>
let deriv_ws, basePrice=2045.30, newsSafe=true;
function connectDeriv(){
 let token=document.getElementById('derivToken').value.trim();
 let tgT=document.getElementById('tgToken').value.trim();
 let tgC=document.getElementById('tgChat').value.trim();
 if(!token){alert('Paste Deriv token first');return;}
 document.getElementById('bal').innerHTML='⏳ Connecting... (allow 5 sec)';
 try{
  deriv_ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
  deriv_ws.onopen=function(){document.getElementById('bal').innerHTML='⏳ Authorizing...'; deriv_ws.send(JSON.stringify({authorize:token}));};
  deriv_ws.onerror=function(){document.getElementById('bal').innerHTML='❌ Failed - Check internet'; alert('Connection failed. Try switching off Data Saver / Lite Mode');};
  deriv_ws.onmessage=function(msg){
   let d=JSON.parse(msg.data);
   if(d.error){document.getElementById('bal').innerHTML='❌ '+d.error.message; alert('Deriv Error: '+d.error.message); return;}
   if(d.msg_type=='authorize'){document.getElementById('bal').innerHTML='✅ Authorized! Getting $10k...'; deriv_ws.send(JSON.stringify({balance:1}));}
   if(d.balance){document.getElementById('bal').innerHTML='✅ DEMO CONNECTED: $'+d.balance.balance.toFixed(2)+' 🎉'; 
    if(tgT&&tgC){fetch('https://api.telegram.org/bot'+tgT+'/sendMessage?chat_id='+tgC+'&text='+encodeURIComponent('✅ JoMoneyBot DEMO Connected: $'+d.balance.balance.toFixed(2)));}
   }
  };
 }catch(e){alert('Error: '+e.message); document.getElementById('bal').innerHTML='❌ '+e.message;}
}
function startBot(){if(!deriv_ws) return alert('Connect first'); alert('Bot started! News filter ON + Telegram ON');}
</script>
</body></html>
