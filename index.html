<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JoMoneyBot Pro</title>
<style>body{margin:0;font-family:-apple-system,sans-serif;background:#fff5f6;padding:16px;color:#333;padding-bottom:100px}.header{font-size:26px;font-weight:800;color:#e57a9e}.card{background:white;border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 4px 20px rgba(229,122,158,.15)}input,select{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:2px solid #ffd1dc;box-sizing:border-box}select{font-weight:700;background:#fff0f3}.row{display:flex;gap:8px;margin-top:10px}.btn{flex:1;padding:11px;border-radius:30px;border:0;font-weight:700}.long{background:#f8bbd0}.long.active{background:#e57a9e;color:white}.short{background:#e9e0f0}.short.active{background:#8e7cc3;color:white}.continue{width:100%;margin-top:14px;padding:16px;border-radius:30px;border:0;background:#e57a9e;color:white;font-size:17px;font-weight:800}.news{padding:10px;border-radius:12px;text-align:center;font-weight:700;margin-top:10px}.safe{background:#dcfce7;color:#166534}.danger{background:#fee2e2;color:#991b1b}.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.box{background:#fff0f3;border-radius:12px;padding:8px;text-align:center}</style></head>
<body>
<div class="header">🎀 JoMoneyBot <span style="font-size:11px;background:#e57a9e;color:white;padding:4px 8px;border-radius:20px">PRO DEMO</span></div>
<small>Step 3 of 3 • News Safe + Telegram</small>

<div class="card" style="border:2px dashed #e57a9e">
<b>🔑 Connect Demo</b>
<input id="derivToken" placeholder="pat_f593beadffa1f656fb8f9f1e54419d4b45ace5241104690c6655af8faad439f8">
<input id="tgToken" placeholder="8205789207:AAEelv-DjJur-UVH1JG3L_gWExWZMi2cuSE">
<input id="tgChat" placeholder="5554709965">
<label style="font-size:12px;margin-top:8px;display:flex;gap:6px"><input type="checkbox" id="demoCheck" checked style="width:auto"> Use DEMO account (recommended)</label>
<button class="continue" style="padding:10px;font-size:14px" onclick="connectDeriv()">Connect Deriv Demo →</button>
<div id="bal" style="margin-top:8px;font-weight:700;text-align:center"></div>
</div>

<div id="newsBox" class="news safe">🟢 Checking news calendar... Safe to trade</div>

<div class="card">
<div style="display:flex;justify-content:space-between"><b id="pairLabel">XAU/USD</b><b id="price">2045.30</b></div>
<select id="pairSelect" onchange="changePair()"><option value="frxXAUUSD">XAU/USD - Gold 🔥</option><option value="frxEURUSD">EUR/USD</option><option value="frxGBPUSD">GBP/USD</option><option value="frxUSDJPY">USD/JPY</option><option value="cryBTCUSD">BTC/USD</option><option value="R_75">V75 Index</option><option value="frxUSDCHF">USD/CHF</option><option value="frxGBPJPY">GBP/JPY</option></select>
<div class="row"><button class="btn long active" id="longBtn" onclick="setDir('LONG')">↑ Long</button><button class="btn short" id="shortBtn" onclick="setDir('SHORT')">↓ Short</button></div>
</div>

<div class="card"><div class="mini"><div class="box"><small>Today P/L</small><br><b id="pnl" style="color:#22c55e">+$0.00</b></div><div class="box"><small>Deriv Balance</small><br><b id="realBal">$0.00 (Demo)</b></div></div></div>

<button class="continue" onclick="startBot()">🚀 Start News-Safe Bot</button>

<script>
let dir='LONG', deriv_ws, authorized=false, currentSymbol='frxXAUUSD', basePrice=2045.30;
function setDir(d){dir=d;document.getElementById('longBtn').className=d=='LONG'?'btn long active':'btn long';document.getElementById('shortBtn').className=d=='SHORT'?'btn short active':'btn short';}
function changePair(){currentSymbol=document.getElementById('pairSelect').value;document.getElementById('pairLabel').innerText=document.getElementById('pairSelect').selectedOptions[0].text; if(deriv_ws) subscribePrice();}
function connectDeriv(){
 let token=document.getElementById('derivToken').value.trim(); if(!token) return alert('Paste Deriv token first');
 deriv_ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
 deriv_ws.onopen=()=>deriv_ws.send(JSON.stringify({authorize:token}));
 deriv_ws.onmessage=(msg)=>{
  let d=JSON.parse(msg.data);
  if(d.msg_type=='authorize'){authorized=true; document.getElementById('bal').innerText='✅ Connected! Fetching demo balance...'; deriv_ws.send(JSON.stringify({balance:1, subscribe:1})); deriv_ws.send(JSON.stringify({account_list:1})); subscribePrice();}
  if(d.msg_type=='balance'){document.getElementById('realBal').innerText='$'+d.balance.balance.toFixed(2)+' (Demo)'; document.getElementById('bal').innerText='✅ Demo Connected: $'+d.balance.balance.toFixed(2);}
  if(d.msg_type=='tick'){basePrice=d.tick.quote; document.getElementById('price').innerText=basePrice.toFixed(2);}
  if(d.msg_type=='buy'){sendTelegram('✅ JoMoneyBot DEMO Trade Opened: '+dir+' '+currentSymbol+' @ '+basePrice);}
 }
}
function subscribePrice(){deriv_ws.send(JSON.stringify({ticks:currentSymbol, subscribe:1}));}
function sendTelegram(text){
 let t=document.getElementById('tgToken').value, c=document.getElementById('tgChat').value; if(!t||!c) return console.log('No TG');
 fetch('https://api.telegram.org/bot'+t+'/sendMessage?chat_id='+c+'&text='+encodeURIComponent(text));
}
// Mock News Filter - real version checks high impact USD
let newsSafe=true;
setInterval(async()=>{
 try{
  // For demo we randomize, in real we fetch forexfactory
  let isNewsTime=Math.random()<0.15; // 15% chance news
  if(isNewsTime){newsSafe=false; document.getElementById('newsBox').className='news danger'; document.getElementById('newsBox').innerText='🔴 HIGH USD NEWS in 18 mins — Bot PAUSED (News Filter ON)'; sendTelegram('⚠️ JoMoneyBot PAUSED: High impact USD news coming, waiting for safe time');}
  else{newsSafe=true; document.getElementById('newsBox').className='news safe'; document.getElementById('newsBox').innerText='🟢 No high impact news — Safe to trade';}
 }catch(e){}
},20000);

function startBot(){
 if(!authorized) return alert('Connect Deriv demo token first!');
 if(!newsSafe) return alert('🔴 Bot paused — High impact news now. Wait 20 mins, e go resume automatically (like our other bot).');
 let amt=1; // $1 demo trade
 let type=dir=='LONG'?'CALL':'PUT';
 deriv_ws.send(JSON.stringify({buy:1, price:amt, parameters:{amount:amt, basis:'stake', contract_type:type, currency:'USD', duration:5, duration_unit:'m', symbol:currentSymbol}}));
 document.getElementById('pnl').innerText='Trade opening...';
}
</script>
</body></html>
